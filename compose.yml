name: facerail

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: facerail_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facerail_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/leewlving/facerail-backend:${FACERAIL_VERSION:-latest}
    restart: unless-stopped
    environment: &backend_environment
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/facerail_production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      FACE_DETECTION_MODEL_PATH: /rails/storage/models/scrfd_500m_bnkps.onnx
      FACE_RECOGNITION_MODEL_PATH: /rails/storage/models/glint360k_cosface_r18_fp16_0.1.onnx
      RAILS_LOG_TO_STDOUT: "1"
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-r2}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./models:/rails/storage/models:ro

  worker:
    image: ghcr.io/leewlving/facerail-backend:${FACERAIL_VERSION:-latest}
    restart: unless-stopped
    command: ["./bin/jobs"]
    environment: *backend_environment
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./models:/rails/storage/models:ro

  frontend:
    image: ghcr.io/leewlving/facerail-frontend:${FACERAIL_VERSION:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:80
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  postgres_data:
